<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Formulário de contato da Copa Senac Hackathon.">
  <title>Contato — Copa Senac Hackathon</title>
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="pular" href="#conteudo">Ir para o conteúdo</a>

  <header>
    <a class="logo" href="index.html">Copa Senac Hackathon</a>

    <button class="btn btn-copa d-lg-none" type="button"
            data-bs-toggle="offcanvas" data-bs-target="#menuPrincipal"
            aria-controls="menuPrincipal">
      Menu
    </button>

    <nav class="offcanvas-lg offcanvas-end menu-principal"
        tabindex="-1" id="menuPrincipal"
        aria-labelledby="titulo-menu-principal" data-bs-theme="dark">
      <div class="offcanvas-header">
        <h2 class="offcanvas-title" id="titulo-menu-principal">Navegação principal</h2>
        <button type="button" class="btn-close btn-close-white"
                data-bs-dismiss="offcanvas" data-bs-target="#menuPrincipal"
                aria-label="Fechar menu"></button>
      </div>
      <div class="offcanvas-body">
        <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="eventos.html">Eventos</a></li>
        <li><a href="contato.html" aria-current="page">Contato</a></li>
        </ul>
      </div>
    </nav>
  </header>

  <main id="conteudo">
    <h1>Contato</h1>

    <section id="contato" aria-labelledby="titulo-contato">
      <h2 id="titulo-contato">Envie uma mensagem</h2>
      <form id="form-contato" action="contato.html" method="get">
        <p id="ajuda-contato">Todos os campos são obrigatórios. Exemplo de e-mail: nome@exemplo.com</p>

        <label for="nome">Nome</label>
        <input id="nome" name="nome" type="text" required autocomplete="name" aria-describedby="ajuda-contato">

        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" required autocomplete="email" aria-describedby="ajuda-contato">

        <label for="mensagem">Mensagem</label>
        <textarea id="mensagem" name="mensagem" rows="5" required aria-describedby="ajuda-contato"></textarea>

        <button type="submit">Enviar mensagem</button>
        <p id="status-contato" role="status"></p>
      </form>
    </section>
  </main>

  <footer>
    <p>Conteúdo fictício. Projeto acadêmico da UC15 — Desenvolvimento Web Mobile.</p>
  </footer>

  <script src="js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
